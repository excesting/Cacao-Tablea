<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bryan's Tablea</title>

  <script src="https://cdn.tailwindcss.com/3.4.4"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bark: {
              50:  '#FFF8E7',
              100: '#FEEBC8',
              200: '#FCD9A0',
              300: '#F6C56E',
              400: '#E8A849',
              500: '#A0522D',
              600: '#8B4513',
              700: '#6B3A2A',
              800: '#4A2818',
              900: '#2D1A0E'
            },
            leaf: {
              50:  '#F0F9F0',
              100: '#DCF0DC',
              500: '#4CAF50',
              600: '#388E3C',
              900: '#1B431D'
            }
          },
          fontFamily: {
            sans:    ['Inter', 'sans-serif'],
            display: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    body {
      background-color: #FAFAFA;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      transform: translateY(150%) scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Mobile bottom nav active indicator */
    .mobile-nav-active {
      color: #388E3C;
    }

    /* Smooth page transitions */
    main {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    
    /* Animation for mobile menu */
    .slide-down {
      animation: slideDown 0.2s ease-out forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: scaleY(0.95); transform-origin: top; }
      to   { opacity: 1; transform: scaleY(1); transform-origin: top; }
    }
  </style>
</head>

<body class="text-bark-900 font-sans min-h-screen flex flex-col selection:bg-leaf-500 selection:text-white">

  <nav class="sticky top-4 z-50 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
    <div class="flex items-center justify-between">

      <div
        class="flex items-center gap-3 cursor-pointer w-[150px]"
        onclick="window.location.href='{{ url_for('home') }}'"
      >
        <div class="w-10 h-10 bg-leaf-50 rounded-xl flex items-center justify-center shadow-sm border border-leaf-100">
          <svg
            width="24" height="24"
            class="w-6 h-6 text-leaf-600"
            fill="none" stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          >
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-bark-900">Bryan'sTablea</span>
      </div>

      <div class="hidden md:flex items-center gap-1 bg-white px-1.5 py-1.5 rounded-full border border-gray-200/70 shadow-sm backdrop-blur-md">
        <a
          href="{{ url_for('home') }}"
          class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 {{ 'bg-gray-100 text-gray-900 shadow-sm' if current_page == 'home' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >Home</a>
        <a
          href="{{ url_for('detect') }}"
          class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 {{ 'bg-gray-100 text-gray-900 shadow-sm' if current_page == 'detect' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >Inspect</a>
        <a
          href="{{ url_for('analytics') }}"
          class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 {{ 'bg-gray-100 text-gray-900 shadow-sm' if current_page == 'analytics' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >Analytics</a>
        <a
          href="{{ url_for('logs') }}"
          class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 {{ 'bg-gray-100 text-gray-900 shadow-sm' if current_page == 'logs' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >Logs</a>
      </div>

      <div class="hidden md:block w-[150px]"></div>

      <div class="md:hidden">
        <button
          id="menuToggle"
          class="text-bark-900 p-2 focus:outline-none"
          aria-label="Toggle menu"
          onclick="toggleMobileMenu()"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path id="menuIconOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path id="menuIconClose" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>

    <div id="mobileMenu" class="hidden md:hidden mt-2 bg-white rounded-2xl border border-gray-200/70 shadow-md overflow-hidden slide-down">
      <div class="flex flex-col p-2 gap-1">
        <a
          href="{{ url_for('home') }}"
          class="px-4 py-3 rounded-xl text-sm font-medium transition-all {{ 'bg-gray-100 text-gray-900' if current_page == 'home' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >
          <i class="fa fa-home mr-2 text-leaf-600"></i>Home
        </a>
        <a
          href="{{ url_for('detect') }}"
          class="px-4 py-3 rounded-xl text-sm font-medium transition-all {{ 'bg-gray-100 text-gray-900' if current_page == 'detect' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >
          <i class="fa fa-magnifying-glass mr-2 text-leaf-600"></i>Inspect
        </a>
        <a
          href="{{ url_for('analytics') }}"
          class="px-4 py-3 rounded-xl text-sm font-medium transition-all {{ 'bg-gray-100 text-gray-900' if current_page == 'analytics' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >
          <i class="fa fa-chart-line mr-2 text-leaf-600"></i>Analytics
        </a>
        <a
          href="{{ url_for('logs') }}"
          class="px-4 py-3 rounded-xl text-sm font-medium transition-all {{ 'bg-gray-100 text-gray-900' if current_page == 'logs' else 'text-gray-500 hover:text-gray-900 hover:bg-gray-50' }}"
        >
          <i class="fa fa-list mr-2 text-leaf-600"></i>Logs
        </a>
      </div>
    </div>
  </nav>
  <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-24 md:pb-12">
    {% block content %}
    {% endblock %}
  </main>

  <div id="toast" class="toast">
    <div class="bg-white rounded-xl shadow-2xl border border-gray-100 p-4 flex items-center gap-3 max-w-sm">
      <div id="toastIcon" class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"></div>
      <div>
        <div id="toastTitle" class="font-bold text-sm text-gray-900">Notification</div>
        <div id="toastMsg" class="text-xs text-gray-500 mt-0.5">System message goes here.</div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='scripts.js') }}?v=7"></script>

  <script>
    // Updated Javascript toggling Tailwind's 'hidden' class directly
    function toggleMobileMenu() {
      const menu     = document.getElementById('mobileMenu');
      const iconOpen  = document.getElementById('menuIconOpen');
      const iconClose = document.getElementById('menuIconClose');

      menu.classList.toggle('hidden');
      iconOpen.classList.toggle('hidden');
      iconClose.classList.toggle('hidden');
    }

    // Close menu when clicking outside
    document.addEventListener('click', function (e) {
      const menu   = document.getElementById('mobileMenu');
      const toggle = document.getElementById('menuToggle');
      
      // Only fire if the menu is currently open
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !toggle.contains(e.target)) {
        menu.classList.add('hidden');
        document.getElementById('menuIconOpen').classList.remove('hidden');
        document.getElementById('menuIconClose').classList.add('hidden');
      }
    });
  </script>

</body>
</html>
