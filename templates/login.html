<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Bryan's Tablea</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      animation: rise 0.4s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #2D1A0E;
      margin-bottom: 6px;
    }

    .card .subtitle {
      text-align: center;
      font-size: 0.82rem;
      color: #9b8574;
      margin-bottom: 28px;
    }

    .error-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff5f5;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      align-items: center;
      border: 1.5px solid #e8e0d8;
      border-radius: 10px;
      background: #fafaf9;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .field:focus-within {
      border-color: #388E3C;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(56,142,60,0.1);
    }

    .field .field-icon {
      padding: 0 4px 0 14px;
      color: #b0a090;
      font-size: 0.82rem;
      flex-shrink: 0;
    }

    .field input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 13px 10px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      color: #2D1A0E;
      outline: none;
      min-width: 0;
    }

    .field input::placeholder { color: #b0a090; }

    .toggle-pw {
      padding: 0 13px;
      background: none;
      border: none;
      color: #b0a090;
      cursor: pointer;
      font-size: 0.82rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .toggle-pw:hover { color: #6B3A2A; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #2D1A0E;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn-login:hover {
      background: #4A2818;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(45,26,14,0.25);
    }

    .btn-login:active {
      transform: translateY(0);
    }

  </style>
</head>

<body>
  <div class="card">

    <h1>Login</h1>
    <p class="subtitle">Enter your credentials to access the dashboard</p>

    {% if error %}
    <div class="error-box">
      <i class="fas fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field">
        <span class="field-icon"><i class="fas fa-user"></i></span>
        <input
          id="username" name="username" type="text"
          placeholder="Enter your username"
          required autofocus
        />
      </div>

      <div class="field">
        <span class="field-icon"><i class="fas fa-lock"></i></span>
        <input
          id="password" name="password" type="password"
          placeholder="Enter your password"
          required
        />
        <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1">
          <i id="eye-icon" class="fas fa-eye"></i>
        </button>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
